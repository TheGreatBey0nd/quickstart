<!DOCTYPE html>
<html lang="de">

<head>
    {{ partial "head.html" . }}
    {{ partial "head_custom.html" . }}
</head>

<body>
    {{ partial "header.html" . }}

    <main class="container section" style="padding-top: 150px; padding-bottom: 80px;">
        <div class="row">
            <div class="col-12 col-lg-10 offset-lg-1">
                <h1 class="mb-4">{{ .Title }}</h1>
                <div class="content">
                    {{ .Content }}
                </div>
            </div>
        </div>
    </main>

    {{ partial "footer.html" . }}
    {{ partial "base-foot.html" . }}
</body>

</html>
