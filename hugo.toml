baseURL = "https://thegreatbey0nd.github.io/quickstart/"
languageCode = "en-us"
theme = ["radity", "hugo-shortcode-gallery"]

# Gallery-Konfiguration
[imaging.meta]
  fields = ["**"]
  sources = ["exif"]

# Plugins
[params.plugins]

  # CSS Plugins
  [[params.plugins.css]]
  URL = "css/main.css"
  [[params.plugins.css]]
  URL = "css/rad-icons.css"
  [[params.plugins.css]]
  URL = "css/custom.css"

  # JS Plugins
  [[params.plugins.js]]
  URL = "js/rad-animations.js"
  [[params.plugins.js]]
  URL = "js/sticky-header.js"
  [[params.plugins.js]]
  URL = "js/library/fontfaceobserver.js"


# navigation
[menu]

  [[menu.header]]
  name = "Über mich"
  URL = "#about"
  weight = 2

  [[menu.header]]
  name = "Musik"
  URL = "#gallery"
  weight = 3

  [[menu.header]]
  name = "Kontakt"
  URL = "#contact"
  weight = 4


  [[menu.footer]]
  name = "About"
  URL = "#about"
  weight = 2

  [[menu.footer]]
  name = "Portfolio"
  URL = "#portfolio"
  weight = 3

  [[menu.footer]]
  name = "Contact"
  URL = "#contact"
  weight = 4


[params]

  sections = ["showcase", "client-and-work", "about", "gallery", "education",  "experience", "testimonial", "contact", "newsletter"]

  [params.logo]
    text1 = "Just"
    text2 = "Nina"

  [params.footer]
      copyright = "thegreatbey0nd"
      [params.footer.radity_logo]
        x = "img/justnina-logo.jpg"
        _2x = "img/justnina-logo.jpg"
        alt = "Design & Code - Radity"
