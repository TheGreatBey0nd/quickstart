name: Deploy Hugo to GitHub Pages

on:
  push:
    branches:
      - main  # anpassen, falls dein default-branch anders heißt

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'   # klont alle Submodule (rekursiv)
          fetch-depth: 0            # optional, nützlich wenn Tags/History gebraucht werden

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.165.0' # 'latest' # oder z.B. '0.111.1'
          extended: true

      - name: Build site
        run: hugo --minify -D

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
